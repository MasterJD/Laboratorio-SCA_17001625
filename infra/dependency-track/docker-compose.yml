# Dependency-Track local para el laboratorio SCA.
# Uso: docker compose -f infra/dependency-track/docker-compose.yml up -d
# UI:  http://localhost:8082  (admin / admin, se pide cambiarla al primer login)
# API: http://localhost:8081
name: jvl-sca-dtrack

services:
  postgres:
    image: postgres:16-alpine
    container_name: jvl-dtrack-postgres
    environment:
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: dtrack
      POSTGRES_DB: dtrack
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  apiserver:
    image: dependencytrack/apiserver:4.14.6
    container_name: jvl-dtrack-apiserver
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: dtrack
      ALPINE_DATABASE_POOL_ENABLED: "true"
      ALPINE_DATABASE_POOL_MAX_SIZE: "20"
      ALPINE_CORS_ENABLED: "true"
      ALPINE_CORS_ALLOW_ORIGIN: "http://localhost:8082"
      EXTRA_JAVA_OPTIONS: "-Xmx4g"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data/apiserver:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 6g
    restart: unless-stopped

  frontend:
    image: dependencytrack/frontend:4.14.6
    container_name: jvl-dtrack-frontend
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - apiserver
    restart: unless-stopped
